<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- SEO básico -->
    <title>MANACO | Calzado que impulsa tu paso</title>
    <meta
      name="description"
      content="Descubre los zapatos MANACO: deportivos, casuales y botines diseñados para tu comodidad y estilo. Calidad boliviana que impulsa cada paso."
    />

    <!-- Open Graph (para compartir en redes sociales) -->
    <meta property="og:title" content="MANACO | Calzado que impulsa tu paso" />
    <meta
      property="og:description"
      content="Zapatos MANACO de alta calidad: deportivos, casuales y botines. Confort y estilo en cada paso."
    />
    <meta property="og:image" content="https://placehold.co/600x400" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />

    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Skip link -->
    <a href="#contenido" class="skip-link">Saltar al contenido</a>

    <!-- Estructura semántica principal -->
    <main class="page" role="document" aria-label="Página principal MANACO">
      <!-- HEADER -->
      <header>
        <h1>MANACO</h1>

        <button class="menu-toggle" aria-expanded="false" aria-controls="menu">
          ☰
        </button>

        <nav aria-label="Menú principal">
          <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#servicios">Servicios</a></li>
            <li><a href="#contacto">Contacto</a></li>
          </ul>
        </nav>
      </header>

      <!-- Contenido principal -->
      <main id="contenido" aria-label="Contenido principal">
        <!-- Banner -->
        <section class="banner" role="region" aria-label="Frase principal">
          Calzado que impulsa tu paso
        </section>

        <!-- Sección productos -->
        <section
          id="productos"
          aria-labelledby="productos-titulo"
          role="region"
        >
          <h2 id="productos-titulo">Productos</h2>

          <ul class="products" role="list">
            <li role="listitem">
              <article
                class="product mobile-column"
                aria-labelledby="prod1-title"
              >
                <img
                  src="https://placehold.co/400"
                  alt="Zapato deportivo MANACO modelo 1 en color negro"
                />
                <h3 id="prod1-title">Producto 1</h3>
                <p class="price">$00.00</p>
                <button type="button" aria-label="Comprar Producto 1">
                  Comprar
                </button>
              </article>
            </li>

            <li role="listitem">
              <article
                class="product mobile-column"
                aria-labelledby="prod2-title"
              >
                <img
                  src="https://placehold.co/400"
                  alt="Zapato casual MANACO modelo 2 en cuero café"
                />
                <h3 id="prod2-title">Producto 2</h3>
                <p class="price">$00.00</p>
                <button type="button" aria-label="Comprar Producto 2">
                  Comprar
                </button>
              </article>
            </li>

            <li role="listitem">
              <article
                class="product mobile-column"
                aria-labelledby="prod3-title"
              >
                <img
                  src="https://placehold.co/400"
                  alt="Botín MANACO modelo 3 en gamuza azul"
                />
                <h3 id="prod3-title">Producto 3</h3>
                <p class="price">$00.00</p>
                <button type="button" aria-label="Comprar Producto 3">
                  Comprar
                </button>
              </article>
            </li>
          </ul>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="site-footer" role="contentinfo">
        Copyright 2025 MANACO
      </footer>
    </main>
  </body>
</html>

<script>
  const toggle = document.querySelector(".menu-toggle");
  const nav = document.querySelector("nav");

  toggle.addEventListener("click", () => {
    const expanded = toggle.getAttribute("aria-expanded") === "true" || false;
    toggle.setAttribute("aria-expanded", !expanded);
    nav.classList.toggle("active");
  });
</script>
