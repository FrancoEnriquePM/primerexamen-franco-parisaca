<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MANACO | Calzado que impulsa tu paso</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Skip link -->
    <a href="#contenido" class="skip-link">Saltar al contenido</a>
    <!-- Estructura semántica principal: sin el uso de DIVs -->
    <main class="page" role="document" aria-label="Página principal MANACO">
      <!-- HEADER: logo y navegación -->
      <header>
        <h1>MANACO</h1>

        <nav aria-label="Menú principal">
          <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#servicios">Servicios</a></li>
            <li><a href="#contacto">Contacto</a></li>
          </ul>
        </nav>
      </header>

      <!-- Contenido principal -->
      <main id="contenido" aria-label="Contenido principal">
        <!-- Banner / hero como sección semántica -->
        <section class="banner" role="region" aria-label="Frase principal">
          Calzado que impulsa tu paso
        </section>

        <!-- Sección productos -->
        <section
          id="productos"
          aria-labelledby="productos-titulo"
          role="region"
        >
          <h2 id="productos-titulo">Productos</h2>

          <ul class="products" role="list">
            <li role="listitem">
              <article class="product" aria-labelledby="prod1-title">
                <img
                  src="https://placehold.co/400"
                  alt="Zapato deportivo MANACO modelo 1"
                />
                <h3 id="prod1-title">Producto 1</h3>
                <p class="price">$00.00</p>
                <button type="button" aria-label="Comprar Producto 1">
                  Comprar
                </button>
              </article>
            </li>

            <li role="listitem">
              <article class="product" aria-labelledby="prod2-title">
                <img
                  src="https://placehold.co/400"
                  alt="Zapato casual MANACO modelo 2"
                />
                <h3 id="prod2-title">Producto 2</h3>
                <p class="price">$00.00</p>
                <button type="button" aria-label="Comprar Producto 2">
                  Comprar
                </button>
              </article>
            </li>

            <li role="listitem">
              <article class="product" aria-labelledby="prod3-title">
                <img
                  src="https://placehold.co/400"
                  alt="Botín MANACO modelo 3"
                />

                <h3 id="prod3-title">Producto 3</h3>
                <p class="price">$00.00</p>
                <button type="button" aria-label="Comprar Producto 3">
                  Comprar
                </button>
              </article>
            </li>
          </ul>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="site-footer" role="contentinfo">
        Copyright 2025 MANACO
      </footer>
    </main>
  </body>
</html>
